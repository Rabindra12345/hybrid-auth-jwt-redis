spring.application.name=auth
# SERVER
server.port=8080
server.servlet.context-path=/api

#  DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/authdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#  JWT CONFIG
jwt.secret=tFiTWSB14TaCpz2ZDYHx4tK1aI7otng+rv3PzTsS1oIoZf3FcCv3l3UrNT8wgNTK
jwt.access.expiration=900000        
jwt.refresh.expiration=604800000     

# REDIS CONFIG
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000

# LETTUCE POOL
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000

# COOKIE SETTINGS
app.cookie.secure=true
app.cookie.http-only=true
app.cookie.same-site=Strict
app.cookie.refresh-token-name=refreshToken
app.cookie.refresh-token-path=/
app.cookie.refresh-token-max-age=604800  # seconds

#  SPRING SECURITY
spring.security.user.name=disabled
spring.security.user.password=disabled

# LOGGING
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.redis=INFO

# PERFORMANCE
server.tomcat.threads.max=200
server.tomcat.accept-count=100
